<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yara - Productivity & Focus Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#0a0f1d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-cyan-500 selection:text-slate-950">
    <!-- Top Header -->
    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Yara</span>
            </div>

            <nav class="hidden md:flex items-center space-x-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                <button class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-cyan-400 shadow">Timer</button>
                <button class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 transition-colors">Analytics</button>
                <button class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 transition-colors">Settings</button>
            </nav>

            <div class="flex items-center space-x-3">
                <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200 hover:border-slate-700 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </button>
                <div class="h-8 w-px bg-slate-800"></div>
                <div class="flex items-center space-x-3 pl-1">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-600 flex items-center justify-center font-bold text-sm text-white shadow-md">YN</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Left Column: Timer & Controls -->
        <section class="lg:col-span-7 flex flex-col space-y-6">
            <!-- Timer Card -->
            <div class="relative overflow-hidden bg-gradient-to-b from-slate-900/90 to-slate-950/90 border border-slate-800/80 rounded-3xl p-8 shadow-2xl flex flex-col items-center justify-center text-center">
                <div class="absolute top-0 left-0 right-0 h-1 bg-slate-800 overflow-hidden">
                    <div id="timer-progress" class="h-full bg-cyan-500 transition-all duration-1000" style="width: 0%"></div>
                </div>

                <!-- Mode Selectors -->
                <div class="flex items-center space-x-2 bg-slate-950/60 p-1.5 rounded-2xl border border-slate-800/80 mb-8">
                    <button data-mode="pomodoro" class="mode-btn px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-cyan-400 shadow">Pomodoro</button>
                    <button data-mode="shortBreak" class="mode-btn px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 transition-colors">Short Break</button>
                    <button data-mode="longBreak" class="mode-btn px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 transition-colors">Long Break</button>
                </div>

                <!-- Time Display -->
                <div class="my-6 flex items-center justify-center font-mono tracking-tighter text-7xl sm:text-8xl font-bold text-white">
                    <span id="minutes">25</span>
                    <span class="text-slate-600 mx-2 animate-pulse">:</span>
                    <span id="seconds">00</span>
                </div>

                <!-- Timer Controls -->
                <div class="flex items-center space-x-4 mt-4">
                    <button id="start-pause-btn" class="px-8 py-3 rounded-xl font-semibold bg-cyan-500 hover:bg-cyan-400 text-slate-950 shadow-lg shadow-cyan-500/20 transition-all">
                        Start
                    </button>
                    <button id="reset-btn" class="px-5 py-3 rounded-xl font-medium bg-slate-800/80 hover:bg-slate-800 text-slate-300 border border-slate-700/60 transition-all">
                        Reset
                    </button>
                </div>
            </div>

            <!-- Quick Stats / Motivation -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-5 flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Focus Time</p>
                        <p class="text-lg font-bold text-white font-mono mt-0.5">1h 25m</p>
                    </div>
                </div>
                <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-5 flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Tasks Done</p>
                        <p class="text-lg font-bold text-white font-mono mt-0.5">3 / 5</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Column: Task Manager -->
        <section class="lg:col-span-5 flex flex-col space-y-6">
            <div class="bg-slate-950 border border-slate-800/80 rounded-3xl p-6 shadow-xl flex flex-col h-full">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                        <span>Tasks</span>
                        <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 font-mono">Focus</span>
                    </h2>
                </div>

                <!-- Add Task Input -->
                <div class="flex items-center space-x-2 mb-6">
                    <input id="task-input" type="text" placeholder="What are you working on?" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors">
                    <button id="add-task-btn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-3 rounded-xl text-sm transition-all shadow-md shadow-cyan-500/20">
                        Add
                    </button>
                </div>

                <!-- Task List -->
                <div id="task-list" class="flex-1 space-y-3 overflow-y-auto max-h-[420px] pr-1">
                    <!-- Tasks rendered dynamically -->
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-slate-900/30 py-4 mt-auto text-center text-xs text-slate-500">
        Yara Productivity Suite &bull; Stay Focused, Accomplish More
    </footer>

    <script src="script.js"></script>
</body>
</html>
